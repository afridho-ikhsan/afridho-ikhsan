<svg
  width="100%"
  height="220"
  viewBox="0 0 854 220"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none"
>
  <style>
    .title {
      font-size: 40px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #ffffff;
      letter-spacing: 1.5px;
    }
    .desc {
      font-size: 16.5px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #e0f2fe;
      letter-spacing: 1px;
    }
  </style>

  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Deep Base Fill -->
  <rect width="854" height="220" fill="#0d1117" opacity="0"/>

  <!-- Animated Wave Layer 1 (Back) -->
  <path fill="url(#waveGrad2)">
    <animate
      attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
      values="M0 0 L0 155 Q213.5 195 427 165 T854 175 L854 0 Z;
              M0 0 L0 170 Q213.5 145 427 150 T854 160 L854 0 Z;
              M0 0 L0 160 Q213.5 175 427 175 T854 180 L854 0 Z;
              M0 0 L0 155 Q213.5 195 427 165 T854 175 L854 0 Z"
    />
  </path>

  <!-- Animated Wave Layer 2 (Front) -->
  <path fill="url(#waveGrad1)">
    <animate
      attributeName="d"
      dur="18s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
      values="M0 0 L0 140 Q213.5 175 427 145 T854 165 L854 0 Z;
              M0 0 L0 160 Q213.5 135 427 160 T854 140 L854 0 Z;
              M0 0 L0 145 Q213.5 160 427 135 T854 155 L854 0 Z;
              M0 0 L0 140 Q213.5 175 427 145 T854 165 L854 0 Z"
    />
  </path>

  <!-- Header Accent Line -->
  <line x1="280" y1="125" x2="574" y2="125" stroke="url(#headerGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Title & Subtitle -->
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="85" class="title">
    Afridho Ikhsan
  </text>
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="148" class="desc">
    Web &amp; Mobile Engineer • Full-Stack Developer
  </text>
</svg>
